<!DOCTYPE html>
<html lang="zh-CN">
<head><script>(function(){
  function makeStore(){
    var data = {};
    var api = {
      getItem: function(k){ return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
      setItem: function(k, v){ data[k] = String(v); },
      removeItem: function(k){ delete data[k]; },
      clear: function(){ data = {}; },
      key: function(i){ return Object.keys(data)[i] || null; }
    };
    Object.defineProperty(api, 'length', { get: function(){ return Object.keys(data).length; } });
    return api;
  }
  function tryShim(name){
    var works = false;
    try { works = !!window[name] && typeof window[name].getItem === 'function'; void window[name].length; }
    catch (_) { works = false; }
    if (works) return;
    try { Object.defineProperty(window, name, { configurable: true, value: makeStore() }); }
    catch (_) { try { window[name] = makeStore(); } catch (__) {} }
  }
  tryShim('localStorage');
  tryShim('sessionStorage');
})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevKit — Retro Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: oklch(8% 0.01 60);
  --bg-2: oklch(11% 0.012 60);
  --surface: oklch(13% 0.015 60);
  --surface-2: oklch(16% 0.018 60);
  --fg: oklch(82% 0.12 75);
  --fg-bright: oklch(90% 0.14 75);
  --muted: oklch(48% 0.06 70);
  --border: oklch(22% 0.02 60);
  --amber: oklch(78% 0.16 70);
  --amber-dim: oklch(30% 0.06 70);
  --amber-glow: oklch(78% 0.16 70 / 0.25);
  --green: oklch(72% 0.18 150);
  --green-dim: oklch(28% 0.06 150);
  --green-glow: oklch(72% 0.18 150 / 0.2);
  --red: oklch(65% 0.2 25);
  --red-dim: oklch(25% 0.06 25);
  --cyan: oklch(78% 0.1 195);
  --cyan-dim: oklch(28% 0.04 195);
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --glow-amber: 0 0 6px var(--amber-glow);
  --glow-green: 0 0 6px var(--green-glow);
  --radius: 0px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-font-smoothing:antialiased}
body{
  font-family:var(--font-mono);
  background:var(--bg);
  color:var(--fg);
  line-height:1.6;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}

/* CRT scanlines */
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,oklch(0% 0 0 / 0.04) 2px,oklch(0% 0 0 / 0.04) 4px);
  pointer-events:none;z-index:9999;
}
/* Vignette */
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at center,transparent 50%,oklch(0% 0 0 / 0.3) 100%);
  pointer-events:none;z-index:9998;
}

::selection{background:var(--amber);color:var(--bg)}
a{color:var(--amber);text-decoration:none}
a:hover{text-shadow:var(--glow-amber)}

/* Cursor blink */
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.cursor{animation:blink 1.1s step-end infinite}
@keyframes flicker{0%{opacity:0.97}5%{opacity:1}10%{opacity:0.98}15%{opacity:1}50%{opacity:0.99}80%{opacity:1}85%{opacity:0.97}100%{opacity:1}}
.flicker{animation:flicker 8s infinite}

/* --- Top Bar --- */
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:100;
  padding:0 24px;height:42px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg-2);
  border-bottom:1px solid var(--border);
}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-brand{
  font-size:14px;font-weight:700;
  color:var(--amber);
  text-shadow:var(--glow-amber);
  letter-spacing:0.04em;
}
.topbar-sep{color:var(--border)}
.topbar-links{display:flex;gap:2px}
.topbar-link{
  padding:5px 12px;
  font-size:12px;font-weight:500;
  color:var(--muted);cursor:pointer;
  transition:all .15s;
  font-family:var(--font-mono);
}
.topbar-link:hover{color:var(--fg)}
.topbar-link.active{color:var(--amber);text-shadow:var(--glow-amber)}
.topbar-right{font-size:11px;color:var(--muted)}

.main{flex:1;padding:24px;max-width:1200px;width:100%;margin:0 auto}

/* --- Hero --- */
.hero{padding:32px 0 28px;border-bottom:1px solid var(--border);margin-bottom:28px}
.hero-prompt{font-size:12px;color:var(--muted);margin-bottom:8px}
.hero-prompt .path{color:var(--cyan)}
.hero h1{
  font-size:clamp(24px,4vw,36px);
  font-weight:700;
  color:var(--amber);
  text-shadow:var(--glow-amber);
  line-height:1.2;
  margin-bottom:10px;
  letter-spacing:-0.02em;
}
.hero p{font-size:13px;color:var(--muted);max-width:520px;line-height:1.7}
.hero-actions{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;
  font-family:var(--font-mono);font-size:12px;font-weight:500;
  cursor:pointer;
  border:1px solid var(--border);
  background:transparent;
  color:var(--fg);
  transition:all .15s;
  text-decoration:none;
}
.btn:hover{border-color:var(--amber);color:var(--amber);text-decoration:none;text-shadow:var(--glow-amber)}
.btn-amber{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.btn-amber:hover{background:var(--amber);color:var(--bg);text-shadow:none}

/* --- Stats --- */
.stats{display:flex;gap:1px;background:var(--border);margin:24px 0;border:1px solid var(--border)}
.stat{background:var(--surface);padding:16px 20px;flex:1;min-width:100px}
.stat-value{font-size:20px;font-weight:700;color:var(--amber);text-shadow:var(--glow-amber);font-variant-numeric:tabular-nums}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}

/* --- Section Headers --- */
.section-hdr{
  font-size:13px;font-weight:600;
  color:var(--amber);
  text-shadow:var(--glow-amber);
  margin:28px 0 12px;
  padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.section-hdr::before{content:'# ';color:var(--muted)}

/* --- Tool Cards (horizontal strip) --- */
.tool-strip{
  display:flex;gap:10px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:24px;
  -webkit-overflow-scrolling:touch;
}
.tool-strip::-webkit-scrollbar{height:4px}
.tool-strip::-webkit-scrollbar-track{background:var(--bg-2)}
.tool-strip::-webkit-scrollbar-thumb{background:var(--border)}

.tool-card{
  flex:0 0 260px;
  background:var(--surface);
  border:1px solid var(--border);
  padding:16px;
  cursor:pointer;
  transition:all .2s;
  text-decoration:none;
  color:var(--fg);
  display:flex;flex-direction:column;
  position:relative;
  min-height:140px;
}
.tool-card:hover{border-color:var(--amber);text-decoration:none;box-shadow:var(--glow-amber)}
.tool-card::before{
  content:'';position:absolute;top:0;left:0;
  width:100%;height:2px;
  background:var(--amber);opacity:0;transition:opacity .2s;
}
.tool-card:hover::before{opacity:1}

.tool-card.wide{flex:0 0 400px}
.tool-card.muted{opacity:0.45;cursor:default;border-style:dashed}
.tool-card.muted:hover{border-color:var(--border);box-shadow:none}

.card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.card-icon{
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;
  border:1px solid var(--amber);
  color:var(--amber);
  background:var(--amber-dim);
}
.card-icon.green{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.card-icon.cyan{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
.card-icon.red{border-color:var(--red);color:var(--red);background:var(--red-dim)}

.card-name{font-size:14px;font-weight:600;color:var(--fg-bright)}
.card-desc{font-size:12px;color:var(--muted);line-height:1.5;flex:1}
.card-tag{
  font-size:10px;font-weight:600;
  padding:2px 6px;
  margin-top:8px;
  display:inline-block;
  background:var(--green-dim);color:var(--green);
  align-self:flex-start;
}
.card-tag.pending{background:var(--surface-2);color:var(--muted);border:1px dashed var(--border)}

.card-preview{
  margin-top:10px;padding:8px 0 0;
  border-top:1px solid var(--border);
  font-size:11px;color:var(--muted);line-height:1.5;
  white-space:pre;overflow:hidden;
}

/* --- Tool Page --- */
.tool-page-header{margin-bottom:24px}
.tool-page-header h1{font-size:20px;font-weight:700;color:var(--amber);text-shadow:var(--glow-amber)}
.tool-page-header p{font-size:13px;color:var(--muted);margin-top:4px}
.back-link{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;
  color:var(--muted);margin-bottom:12px;
  cursor:pointer;transition:color .15s;
}
.back-link:hover{color:var(--amber);text-decoration:none}

.tool-layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.tool-layout{grid-template-columns:1fr}}

.tool-panel{
  background:var(--surface);
  border:1px solid var(--border);
  overflow:hidden;
  display:flex;flex-direction:column;
}
.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;
  border-bottom:1px solid var(--border);
  font-size:11px;font-weight:600;
  color:var(--muted);
  background:var(--bg-2);
}
.panel-header::before{content:'// ';color:var(--border)}
.panel-actions{display:flex;gap:4px}
.panel-btn{
  padding:3px 8px;
  font-size:11px;font-weight:500;font-family:var(--font-mono);
  background:transparent;border:1px solid var(--border);
  color:var(--muted);cursor:pointer;transition:all .15s;
}
.panel-btn:hover{border-color:var(--fg);color:var(--fg)}
.panel-btn.amber{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.panel-btn.amber:hover{background:var(--amber);color:var(--bg)}

textarea{
  width:100%;border:none;outline:none;resize:vertical;
  font-family:var(--font-mono);font-size:12px;line-height:1.6;
  padding:12px;background:var(--bg);color:var(--fg);
  min-height:260px;tab-size:2;
}
textarea::placeholder{color:var(--muted)}
.output-area{
  font-family:var(--font-mono);font-size:12px;line-height:1.6;
  padding:12px;min-height:260px;
  white-space:pre-wrap;word-break:break-all;overflow:auto;
  background:var(--bg);
}
.error-msg{color:var(--red);font-size:11px;padding:6px 12px;background:var(--red-dim);border-left:2px solid var(--red);margin:0}

/* Regex */
.regex-input-row{
  display:flex;gap:6px;align-items:center;
  padding:8px 12px;border-bottom:1px solid var(--border);
  background:var(--bg);
}
.regex-input-row .delim{color:var(--amber);font-size:14px}
.regex-input-row input{
  flex:1;border:none;outline:none;
  font-family:var(--font-mono);font-size:13px;
  background:transparent;color:var(--fg);
}
.flag-btn{
  padding:2px 6px;
  font-size:11px;font-family:var(--font-mono);
  background:transparent;border:1px solid var(--border);
  color:var(--muted);cursor:pointer;transition:all .15s;
}
.flag-btn.on{background:var(--amber-dim);color:var(--amber);border-color:var(--amber)}
.match-highlight{background:var(--amber-dim);border-bottom:2px solid var(--amber);color:var(--amber);padding:0 1px}
.match-list-item{
  padding:6px 12px;border-bottom:1px solid var(--border);
  font-size:11px;display:flex;align-items:center;gap:10px;
}
.match-index{color:var(--amber);font-weight:600;min-width:20px}
.match-text{color:var(--fg)}
.match-group{color:var(--muted);font-size:10px}

/* Logs */
.log-controls{
  display:flex;gap:6px;padding:8px 12px;
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;align-items:center;background:var(--bg);
}
.log-controls input,.log-controls select{
  border:1px solid var(--border);padding:4px 8px;
  font-size:11px;font-family:var(--font-mono);
  background:var(--surface);color:var(--fg);outline:none;
}
.log-controls input:focus,.log-controls select:focus{border-color:var(--amber)}
.log-line{
  padding:3px 12px;font-size:11px;line-height:1.5;
  border-bottom:1px solid var(--surface-2);
}
.log-line:hover{background:var(--amber-dim)}
.log-ts{color:var(--muted)}
.log-level-ERROR{color:var(--red);font-weight:600}
.log-level-WARN{color:oklch(72% 0.14 70);font-weight:500}
.log-level-INFO{color:var(--cyan)}
.log-level-DEBUG{color:var(--muted)}
.log-stats{
  display:flex;gap:16px;padding:8px 12px;
  border-top:1px solid var(--border);
  font-size:10px;color:var(--muted);
  background:var(--bg-2);
}
.log-stat-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}

/* --- About --- */
.about-header{margin-bottom:28px}
.about-header h1{font-size:22px;font-weight:700;color:var(--amber);text-shadow:var(--glow-amber)}
.about-header p{font-size:13px;color:var(--muted);margin-top:6px;max-width:520px}
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.about-card{
  background:var(--surface);border:1px solid var(--border);padding:18px;
}
.about-card h3{font-size:13px;font-weight:600;color:var(--amber);margin-bottom:6px}
.about-card h3::before{content:'## ';color:var(--muted)}
.about-card p{font-size:12px;color:var(--muted);line-height:1.6}
.about-card ul{list-style:none;padding:0;margin-top:8px}
.about-card li{font-size:12px;color:var(--muted);padding:2px 0}
.about-card li::before{content:'- ';color:var(--amber)}

/* --- Changelog --- */
.changelog-header{margin-bottom:28px}
.changelog-header h1{font-size:18px;font-weight:700;color:var(--amber);text-shadow:var(--glow-amber)}
.changelog-entry{margin-bottom:24px}
.changelog-entry-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.changelog-version{font-size:12px;font-weight:600;padding:2px 8px;background:var(--amber-dim);color:var(--amber)}
.changelog-date{font-size:11px;color:var(--muted)}
.changelog-list{list-style:none;padding:0}
.changelog-list li{font-size:12px;padding:3px 0;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.changelog-tag{font-size:10px;font-weight:600;padding:1px 5px;text-transform:uppercase;letter-spacing:0.06em;flex-shrink:0;margin-top:2px}
.tag-new{background:var(--green-dim);color:var(--green)}
.tag-fix{background:var(--red-dim);color:var(--red)}
.tag-improve{background:var(--cyan-dim);color:var(--cyan)}

/* --- Responsive --- */
@media(max-width:768px){
  .main{padding:16px}
  .hero{padding:20px 0}
  .stats{flex-direction:column}
  .tool-strip{flex-direction:column}
  .tool-card,.tool-card.wide{flex:none;width:100%}
}
</style>
</head>
<body>
<div class="app flicker">
  <nav class="topbar">
    <div class="topbar-left">
      <div class="topbar-brand">DEVKIT<span class="cursor">_</span></div>
      <span class="topbar-sep">|</span>
      <div class="topbar-links">
        <a class="topbar-link" href="#/" data-page="home">home</a>
        <a class="topbar-link" href="#/about" data-page="about">about</a>
        <a class="topbar-link" href="#/changelog" data-page="changelog">changelog</a>
      </div>
    </div>
    <div class="topbar-right">v0.1.0 // amber phosphor</div>
  </nav>
  <div class="main" id="app"></div>
</div>

<script>
const app = document.getElementById('app');
const navLinks = document.querySelectorAll('.topbar-link');

function navigate() {
  const hash = location.hash.slice(2) || 'home';
  navLinks.forEach(l => l.classList.toggle('active', l.dataset.page === hash));
  const renderer = pages[hash];
  if (renderer) { app.innerHTML = renderer(); afterRender(hash); }
}
window.addEventListener('hashchange', navigate);

const pages = {};

pages.home = () => `
<div class="hero">
  <div class="hero-prompt"><span class="path">~/devkit</span> $ cat README.md</div>
  <h1>Retro Terminal</h1>
  <p>琥珀磷光屏上的开发工具集。纯前端运行，数据不出浏览器。按需调用，即用即走。</p>
  <div class="hero-actions">
    <a href="#/json" class="btn btn-amber">./start</a>
    <a href="#/about" class="btn">cat about.md</a>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-value">6</div><div class="stat-label">tools</div></div>
  <div class="stat"><div class="stat-value">0</div><div class="stat-label">deps</div></div>
  <div class="stat"><div class="stat-value">100%</div><div class="stat-label">local</div></div>
  <div class="stat"><div class="stat-value">&lt;1s</div><div class="stat-label">boot</div></div>
</div>

<div class="section-hdr">active tools</div>
<div class="tool-strip">
  <a class="tool-card wide" href="#/json">
    <div class="card-hdr">
      <div class="card-icon">{}</div>
      <div class="card-name">json-fmt</div>
    </div>
    <div class="card-desc">格式化、压缩、验证 JSON 数据，支持语法错误定位</div>
    <span class="card-tag">active</span>
    <div class="card-preview">{
  "name": "devkit",
  "version": "0.1.0",
  "status": "active"
}</div>
  </a>
  <a class="tool-card" href="#/regex">
    <div class="card-hdr">
      <div class="card-icon green">.*</div>
      <div class="card-name">regex-test</div>
    </div>
    <div class="card-desc">实时测试正则表达式，高亮匹配，查看捕获组</div>
    <span class="card-tag">active</span>
  </a>
  <a class="tool-card" href="#/logs">
    <div class="card-hdr">
      <div class="card-icon cyan">|_</div>
      <div class="card-name">log-analyzer</div>
    </div>
    <div class="card-desc">粘贴日志，按级别筛选，关键词搜索，快速定位</div>
    <span class="card-tag">active</span>
  </a>
</div>

<div class="section-hdr">pending</div>
<div class="tool-strip">
  <div class="tool-card muted">
    <div class="card-hdr">
      <div class="card-icon red">()</div>
      <div class="card-name">totp-gen</div>
    </div>
    <div class="card-desc">基于 TOTP 的二步验证码生成</div>
    <span class="card-tag pending">pending</span>
  </div>
  <div class="tool-card muted">
    <div class="card-hdr">
      <div class="card-icon">文</div>
      <div class="card-name">translator</div>
    </div>
    <div class="card-desc">代码注释 / 文档多语言翻译</div>
    <span class="card-tag pending">pending</span>
  </div>
  <div class="tool-card muted">
    <div class="card-hdr">
      <div class="card-icon green">$_</div>
      <div class="card-name">adb-shell</div>
    </div>
    <div class="card-desc">ADB 命令封装，设备管理</div>
    <span class="card-tag pending">pending</span>
  </div>
</div>
`;

// --- JSON ---
pages.json = () => `
<a class="back-link" href="#/">← home</a>
<div class="tool-page-header">
  <h1>json-fmt</h1>
  <p>格式化、压缩、验证 JSON。粘贴数据后执行操作。</p>
</div>
<div class="tool-layout">
  <div class="tool-panel">
    <div class="panel-header">stdin <div class="panel-actions">
      <button class="panel-btn" onclick="jsonSample()">sample</button>
      <button class="panel-btn" onclick="document.getElementById('json-input').value=''">clear</button>
    </div></div>
    <textarea id="json-input" placeholder='粘贴 JSON...\n{"key":"value"}'></textarea>
  </div>
  <div class="tool-panel">
    <div class="panel-header">stdout <div class="panel-actions">
      <button class="panel-btn amber" onclick="jsonFormat()">fmt</button>
      <button class="panel-btn" onclick="jsonMinify()">min</button>
      <button class="panel-btn" onclick="jsonCopy()">cp</button>
    </div></div>
    <div class="output-area" id="json-output">// waiting for input...</div>
    <div id="json-error"></div>
  </div>
</div>
`;

function jsonFormat() {
  const input = document.getElementById('json-input').value.trim();
  const errEl = document.getElementById('json-error');
  const outEl = document.getElementById('json-output');
  if (!input) { outEl.textContent = '// waiting for input...'; errEl.innerHTML = ''; return; }
  try { outEl.textContent = JSON.stringify(JSON.parse(input), null, 2); errEl.innerHTML = ''; }
  catch (e) { errEl.innerHTML = `<div class="error-msg">ERR: ${e.message}</div>`; }
}
function jsonMinify() {

pages.regex = () => `
<a class="back-link" href="#/">← home</a>
<div class="tool-page-header">
  <h1>regex-test</h1>
  <p>输入正则表达式和测试文本，实时查看匹配。</p>
</div>
<div class="tool-layout">
  <div class="tool-panel">
    <div class="panel-header">pattern <div class="panel-actions">
      <button class="flag-btn" id="flag-g" onclick="toggleFlag('g')">g</button>
      <button class="flag-btn on" id="flag-i" onclick="toggleFlag('i')">i</button>
      <button class="flag-btn" id="flag-m" onclick="toggleFlag('m')">m</button>
      <button class="flag-btn" id="flag-s" onclick="toggleFlag('s')">s</button>
    </div></div>
    <div class="regex-input-row">
      <span class="delim">/</span>
      <input type="text" id="regex-pattern" placeholder="正则表达式..." oninput="runRegex()">
      <span class="delim">/</span>
      <span id="regex-flags-display" style="color:var(--cyan);font-size:13px;">i</span>
    </div>
    <div class="panel-header">test string</div>
    <textarea id="regex-test" placeholder="输入测试文本..." oninput="runRegex()" style="min-height:200px;"></textarea>
  </div>
  <div class="tool-panel">
    <div class="panel-header">matches <span id="regex-count" style="font-size:10px;color:var(--muted)">0 found</span></div>
    <div id="regex-output" class="output-area" style="min-height:200px;"><span style="color:var(--muted)">// enter pattern + text</span></div>
    <div class="panel-header">match list</div>
    <div id="regex-matches" style="max-height:200px;overflow:auto;">
      <div style="padding:12px;color:var(--muted);font-size:11px;">// no matches</div>
    </div>
  </div>
</div>
`;

const regexFlags = { g: false, i: true, m: false, s: false };
function toggleFlag(f) {
  regexFlags[f] = !regexFlags[f];
  document.getElementById('flag-' + f).classList.toggle('on', regexFlags[f]);
  document.getElementById('regex-flags-display').textContent = Object.entries(regexFlags).filter(([,v])=>v).map(([k])=>k).join('');
  runRegex();
}
function runRegex() {
  const pattern = document.getElementById('regex-pattern').value;
  const testStr = document.getElementById('regex-test').value;
  const outEl = document.getElementById('regex-output');
  const matchEl = document.getElementById('regex-matches');
  const countEl = document.getElementById('regex-count');
  if (!pattern || !testStr) {
    outEl.innerHTML = '<span style="color:var(--muted)">// enter pattern + text</span>';
    matchEl.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:11px;">// no matches</div>';
    countEl.textContent = '0 found';
    return;
  }
  try {
    const flags = Object.entries(regexFlags).filter(([,v])=>v).map(([k])=>k).join('');
    const re = new RegExp(pattern, flags);
    const matches = [];
    let m;
    if (flags.includes('g')) {
      while ((m = re.exec(testStr)) !== null) { matches.push({index:m.index,match:m[0],groups:m.slice(1)}); if (m[0].length===0) re.lastIndex++; }
    } else { m = re.exec(testStr); if (m) matches.push({index:m.index,match:m[0],groups:m.slice(1)}); }
    countEl.textContent = `${matches.length} found`;
    let highlighted = '', last = 0;
    matches.forEach(m => { highlighted += escHtml(testStr.slice(last,m.index)); highlighted += `<span class="match-highlight">${escHtml(m.match)}</span>`; last = m.index+m.match.length; });
    highlighted += escHtml(testStr.slice(last));
    outEl.innerHTML = highlighted || '<span style="color:var(--muted)">// no matches</span>';
    if (matches.length) {
      matchEl.innerHTML = matches.map((m,i) => `<div class="match-list-item"><span class="match-index">#${i+1}</span><span class="match-text">${escHtml(m.match)}</span>${m.groups.length?`<span class="match-group">groups(${m.groups.map(g=>escHtml(g||'—')).join(',')})</span>`:''}</div>`).join('');
    } else { matchEl.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:11px;">// no matches</div>'; }
  } catch (e) {
    outEl.innerHTML = `<div class="error-msg">ERR: ${e.message}</div>`;
    matchEl.innerHTML = ''; countEl.textContent = 'ERR';
  }
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let parsedLogs = [];
function parseLogs() {
  const raw = document.getElementById('log-input').value.trim();
  if (!raw) return;
  parsedLogs = raw.split('\n').map((line,i) => {
    const levelMatch = line.match(/\b(ERROR|WARN|INFO|DEBUG)\b/i);
    const tsMatch = line.match(/(\d{4}[-/]\d{2}[-/]\d{2}[\sT]\d{2}:\d{2}(?::\d{2})?)/);
    return {line:i+1,raw:line,level:levelMatch?levelMatch[1].toUpperCase():'INFO',timestamp:tsMatch?tsMatch[1]:''};
  });
  document.getElementById('log-panel').style.display = '';
  filterLogs();
}
function filterLogs() {
  const text = document.getElementById('log-filter-text').value.toLowerCase();
  const level = document.getElementById('log-filter-level').value;
  const filtered = parsedLogs.filter(l => (level==='all'||l.level===level) && (!text||l.raw.toLowerCase().includes(text)));
  document.getElementById('log-filter-count').textContent = `${filtered.length}/${parsedLogs.length} lines`;
  document.getElementById('log-output').innerHTML = filtered.map(l => {
    const colored = l.raw.replace(/(ERROR)/i,'<span class="log-level-ERROR">$1</span>').replace(/(WARN)/i,'<span class="log-level-WARN">$1</span>').replace(/(INFO)/i,'<span class="log-level-INFO">$1</span>').replace(/(DEBUG)/i,'<span class="log-level-DEBUG">$1</span>');
    return `<div class="log-line">${l.timestamp?`<span class="log-ts">${escHtml(l.timestamp)}</span> `:''}${colored}</div>`;
  }).join('') || '<div style="padding:12px;color:var(--muted);font-size:11px;">// no matching lines</div>';
  const counts = {};
  parsedLogs.forEach(l => { counts[l.level]=(counts[l.level]||0)+1; });
  const colors = {ERROR:'var(--red)',WARN:'oklch(72% 0.14 70)',INFO:'var(--cyan)',DEBUG:'var(--muted)'};
  document.getElementById('log-stats').innerHTML = Object.entries(counts).map(([k,v]) =>
    `<div style="display:flex;align-items:center;gap:4px;"><span class="log-stat-dot" style="background:${colors[k]||'var(--muted)'}"></span>${k}: ${v}</div>`
  ).join('');
}
